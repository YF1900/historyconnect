<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      セキュリティ設定
      - 読み込み先を自サイトと国土地理院の地図タイルに限定（CSP）
      - 外部サイトへ参照元URLを送らない（Referrer-Policy）
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://cyberjapandata.gsi.go.jp; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'; worker-src 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#7a2e1f" />
    <meta name="description" content="好きな人物・時代・場所から、日本の歴史と博物館・城跡を探せるWebアプリ（試験版）" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>ヒストリーコネクト｜歴史探究（試験版）</title>
  </head>
  <body>
    <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
